<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Roblox Asset Viewer</title>
  <link rel="icon" href="/roblox/favicon.ico">
  <link rel="preload" href="/brand/BuilderSans-Regular.otf" as="font" type="font/otf" crossorigin>
  <link rel="stylesheet" href="/style.css">
  <script type="importmap">{ "imports": { "three": "/vendor/three/three.module.min.js" } }</script>
  <script src="/vendor/lucide.min.js"></script>
</head>
<body>
  <template id="mark-template">
    <svg viewBox="0 0 56 56" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path fill="currentColor" d="M11.676 0 0 44.166 43.577 56l11.676-44.166zm20.409 35.827-12.177-3.308 3.264-12.342 12.182 3.308z"/></svg>
  </template>

  <div class="splash" id="splash" role="status" aria-label="Loading Roblox Asset Viewer">
    <div class="splash-art" id="splash-art" aria-hidden="true"><img id="splash-image" alt=""></div>
    <div class="splash-shade" aria-hidden="true"></div>
    <img class="wordmark splash-wordmark" src="/roblox/logo.svg" alt="Roblox">
    <div class="progress" aria-hidden="true"><span></span></div>
    <p class="splash-status" id="splash-status">Loading…</p>
  </div>

  <div class="app" id="app">
    <aside class="side" id="side">
      <div class="brand">
        <img class="wordmark" src="/roblox/logo.svg" alt="Roblox">
        <span class="brand-label">Asset Viewer</span>
      </div>
      <div class="game-picker">
        <img id="game-icon" class="game-icon" alt="" hidden>
        <select id="game-select" class="game-select" aria-label="Game"></select>
      </div>
      <nav class="cats" id="cats" aria-label="Asset types"></nav>
      <p class="side-note" id="side-note"></p>
    </aside>
    <main class="browse" id="browse">
      <div class="bar">
        <div class="search">
          <span class="search-icon" data-icon="Search"></span>
          <input id="search" type="search" placeholder="Search by name or asset ID" autocomplete="off" spellcheck="false" aria-label="Search assets">
        </div>
        <label class="sort">
          <span class="visually-hidden">Sort by</span>
          <select id="sort">
            <option value="newest">Newest</option>
            <option value="largest">Largest</option>
            <option value="name">Name</option>
          </select>
        </label>
        <label class="only" id="only-wrap" hidden>
          <input type="checkbox" id="only">
          <span id="only-label"></span>
        </label>
      </div>
      <p class="count" id="count" role="status"></p>
      <div class="list" id="list"></div>
      <div id="sentinel" aria-hidden="true"></div>
    </main>
    <section class="inspect" id="inspect" aria-label="Selected asset"></section>
  </div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
