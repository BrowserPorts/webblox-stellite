<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebBlox</title>
  <link rel="icon" href="/038e4bd621bee962e64ed84fac16608407267adc/assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/play.roblox.com/038e4bd621bee962e64ed84fac16608407267adc/assets/loading/BuilderSans-Regular.otf" as="font" type="font/otf" crossorigin>
  <link rel="preload" href="/play.roblox.com/038e4bd621bee962e64ed84fac16608407267adc/assets/loading/BuilderSans-Bold.otf" as="font" type="font/otf" crossorigin>
  <link rel="preconnect" href="https://tr.rbxcdn.com">
  <script>
    try {
      var theme = localStorage.getItem('webblox.launcher.theme');
      if (theme === 'system') theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      if (theme) document.documentElement.dataset.theme = theme;
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="/launcher/style.css">
  <script type="module" src="/launcher/js/app.js"></script>
</head>
<body>
  <header class="top">
    <div class="shell-tabs" aria-hidden="true"><span class="shell-tab"><span class="shell-tab-icon" id="shell-icon"></span><span id="shell-title">Home</span></span></div>
    <div class="shell-nav">
      <button class="shell-button" id="shell-back" type="button" aria-label="Back" data-icon="chevron-large-left"></button>
      <button class="shell-button" id="shell-forward" type="button" aria-label="Forward" data-icon="chevron-large-right"></button>
      <button class="shell-button" id="shell-reload" type="button" aria-label="Reload" data-icon="arrow-spin-clockwise"></button>
    </div>
    <a class="logo" href="#/" aria-label="WebBlox home">
      <svg viewBox="157 157 710 710" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M307.201 157.281L157.281 716.799L716.799 866.719L866.719 307.201L307.201 157.281ZM569.242 611.157L412.893 569.242L454.807 412.893L611.219 454.807L569.242 611.157Z"/></svg>
    </a>
    <form class="find" id="find" role="search">
      <span class="find-icon" data-icon="magnifying-glass"></span>
      <input id="query" type="search" placeholder="Search games, people and communities" autocomplete="off" spellcheck="false" role="combobox" aria-label="Search" aria-expanded="false" aria-controls="suggestions" aria-autocomplete="list">
      <ul class="suggestions" id="suggestions" role="listbox" aria-label="Search suggestions" hidden></ul>
    </form>
    <div class="shell-online" id="shell-online" hidden></div>
    <time class="shell-clock" id="shell-clock"></time>
    <div class="me" id="me"></div>
    <a class="shell-gear" href="#/settings" aria-label="Settings" data-icon="gear"></a>
  </header>
  <nav class="rail" id="rail" aria-label="Main"></nav>
  <div class="layout" id="layout">
    <main class="content" id="content"></main>
    <aside class="friends-column" id="friends" aria-label="Friends online" hidden></aside>
  </div>
  <div class="toasts" id="toasts"></div>
</body>
</html>
